{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="auth card pad">
  <h1>Create your account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Full name<input name="name" value="{{ name }}" required maxlength="60" autocomplete="name"></label>
    <label class="field">Email<input type="email" name="email" value="{{ email }}" required autocomplete="email"></label>
    <label class="field">Password (min 8 characters)<input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn block">Sign up</button>
  </form>
  <p class="small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
