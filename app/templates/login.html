{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth card pad">
  <h1>Welcome back</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">Email<input type="email" name="email" value="{{ email }}" required autocomplete="email"></label>
    <label class="field">Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn block">Log in</button>
  </form>
  <p class="small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
